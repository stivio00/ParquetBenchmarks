[project]
name = "parquet-benchmarks-py"
version = "0.1.0"
description = "Parquet read/write benchmarks in Python: polars, pandas (pyarrow + fastparquet engines), pyarrow and duckdb"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2",
    "fastparquet>=2024.5.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=18.0",
]

[tool.uv]
# Script-style project: dependencies only, no package build.
package = false
